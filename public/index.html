<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SignalSense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared.css" />
  <link rel="stylesheet" href="/family.css" />
  <link rel="stylesheet" href="/researcher.css" />
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div class="wordmark"><span class="dot" aria-hidden="true"></span><span class="name">Signal<em>Sense</em></span></div>
      <p class="tagline">Firsthand signals, caught before they fade.</p>
    </header>

    <nav class="tabs" role="tablist" aria-label="View">
      <button class="tab" role="tab" id="tab-family" aria-controls="view-family" aria-selected="true" data-view="family">FAMILY</button>
      <button class="tab" role="tab" id="tab-researcher" aria-controls="view-researcher" aria-selected="false" data-view="researcher">RESEARCHER</button>
    </nav>

    <section id="view-family" role="tabpanel" aria-labelledby="tab-family"></section>
    <section id="view-researcher" role="tabpanel" aria-labelledby="tab-researcher" hidden></section>
  </main>

  <div id="toasts" aria-live="polite"></div>

  <script src="/app.js"></script>
  <script src="/family.js"></script>
  <script src="/researcher.js"></script>
</body>
</html>
